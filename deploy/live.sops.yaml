# denpa-hub の実況の視聴の接続先を引く設定 (POST /niconico/live/watch)。ニコニコ固有の値なので平文で書かない。
# キーは環境変数の名前そのまま (docs/niconico.md の「設定」)。Deployment が envFrom で全部読む。
#   NICONICO_LIVE_PROGRAM_URL / NICONICO_LIVE_PROGRAM_FIELD … チャンネルの放送中の番組を引く URL と、応答の番組の ID の場所
#   NICONICO_LIVE_WATCH_URL … 視聴の WebSocket の接続先を引く URL。応答の形が資料に無いので NICONICO_LIVE_WATCH_FIELD は置かない (最初の wss:// の URL を使う)
# 局の対応表 (NICONICO_LIVE_CHANNELS) は秘密ではないので deployment.yaml に平文で書いてある。
# 値は SOPS で暗号化してある (../.sops.yaml)。直すときは danything/gitops の `tools/t sops edit <このファイル>` で開いて push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈で Deployment が入れ替わる。
