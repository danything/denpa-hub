# denpa-hub の namespace の秘密(Secret denpa-hub)。中継の設定のうち、リポジトリに書かないもの (シークレットと、ニコニコ固有のエンドポイント・スコープ)。
# キーは環境変数の名前そのまま (NICONICO_CLIENT_ID など。docs/niconico.md の「設定」)。Deployment が envFrom で全部読む。
# まだ値が無いので secretTemplates は空(Secret denpa-hub は無い)。値ができたら name: denpa-hub の stringData に入れる。
# 値は SOPS で暗号化してある(../.sops.yaml。管理者の鍵とクラスタの鍵)。直すときは管理者の鍵で `sops edit deploy/secrets.sops.yaml` して push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈のある workload が入れ替わる。
