# denpa-hub の namespace の秘密。中継の設定のうちリポジトリに平文で書かないもの (シークレットと、ニコニコ固有の値)。
# キーは環境変数の名前そのまま (docs/niconico.md の「設定」)。Deployment が envFrom で全部読む。
#   NICONICO_CLIENT_ID / NICONICO_CLIENT_SECRET … ドワンゴが発行したクライアント
#   NICONICO_AUTHORIZE_URL / NICONICO_TOKEN_URL / NICONICO_SCOPE … ニコニコ固有の値
#   NICONICO_STATE_KEY … state を暗号化する鍵 (32 バイトの base64)。替えると途中の連携 (最長 10 分) がやり直しになる
#   NICONICO_ALLOWED_RETURN_HOSTS … LAN のアドレス以外で戻り先に通す denpa (Doa の denpa)
# 値は SOPS で暗号化してある (../.sops.yaml)。直すときは danything/gitops の `tools/t sops edit <このファイル>` で開いて push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈で Deployment が入れ替わる。
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: secrets
    namespace: denpa-hub
spec:
    secretTemplates:
        - name: denpa-hub
