# Infisical (il.doany.io) のプロジェクト doa・環境 prod から、Infisical 純正 operator が Secret を作る。
# フォルダの中のシークレットを全部そのままキーにするので、Infisical にキーを足せばここは触らずに済む。
# 値は Infisical の UI で書き換えるだけ (Deployment の auto-reload の注釈で Pod が入れ替わる)。
#
# sync-options の 2 つは danything/gitops の bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」
# (Prune=false: operator が Secret に写す ArgoCD の印で prune されないように。
#  SkipDryRunOnMissingResource=true: CRD がまだ無いクラスタで同期を止めないように)

# /denpa-hub/denpa-hub … 中継の設定のうち、リポジトリに書かないもの (シークレットと、ニコニコ固有のエンドポイント・スコープ)。
# キーは環境変数の名前そのまま (NICONICO_CLIENT_ID など。docs/niconico.md の「設定」)。Deployment が envFrom で全部読む
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: denpa-hub
  namespace: denpa-hub
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /denpa-hub/denpa-hub
        recursive: false
  managedKubeSecretReferences:
    - secretName: denpa-hub
      secretNamespace: denpa-hub
      # Orphan: CR を消しても Secret は残す (作り直しで稼働中の Pod を巻き込まない)
      creationPolicy: Orphan
