# denpa-hub の実況のコメントの中継の鍵 (docs/jikkyo.md の「設定」と「データの持ち方」)。キーは環境変数の名前そのまま。Deployment が envFrom で読む。
#   JIKKYO_KEY … 保存する利用者の ID と、NX-Jikkyo に渡す Cookie を作る鍵 (32 バイトの base64。openssl rand -base64 32 で作った)。
#                替えると全員の ID が替わる (方針の blockedAuthors が当たらなくなり、NX-Jikkyo での ID も替わる)
# 値は SOPS で暗号化してある (../.sops.yaml)。直すときは danything/gitops の `tools/t sops edit <このファイル>` で開いて push する。
# クラスタの中では sops-secrets-operator が Secret にし、Reloader の注釈で Deployment が入れ替わる。
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
    name: jikkyo
    namespace: denpa-hub
spec:
    secretTemplates:
        - name: denpa-hub-jikkyo
