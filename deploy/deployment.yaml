# denpa-hub 本体。番組ランキングと実況のデータ (SQLite のファイルを 1 つずつ) を同じ PVC に置くので、1 台だけで動かし、
# 入れ替えは Recreate にする (同じファイルを 2 つのプロセスで開かないように。docs/ranking.md と docs/jikkyo.md の「データの持ち方」)。
# データのバックアップは取らない (票はどれも数が決まれば消すもので、失っても denpa が送り直せば戻る。外部に示す集計は、示すときに denpa-hub tallies で読み出して手元に残す。
# 実況の独自コメントは保存期間を過ぎれば消すもので、失えば録画の過去ログから抜けるだけ)。
#
# 設定のうちリポジトリに書いてよいものはここに、書かないもの (シークレットとニコニコ固有の値) は
# SOPS で暗号化した secrets.sops.yaml・live.sops.yaml・jikkyo.sops.yaml から sops-secrets-operator が作る Secret denpa-hub・denpa-hub-live・denpa-hub-jikkyo にあり、envFrom で全部読む。
# ランキングの印の鍵 RANKING_MARK_KEY も Secret denpa-hub にある。**ランキングの入ったイメージは、RANKING_DATA があるのに鍵が無いと起動しない。**
# 実況も同じく、JIKKYO_DATA があるのに JIKKYO_KEY (Secret denpa-hub-jikkyo) か方針のファイルが無いと起動しない。
# Secret の値を書き換えると、Reloader の注釈で Pod が入れ替わる。実況の運営の方針 (jikkyo-policy.yaml の ConfigMap) は入れ替えずに hub が読み直す。
#
# イメージは v* のタグを push すると CI が ghcr.io に出す。入れ替えるときはタグと digest を両方書き換える。
# ghcr.io のパッケージは公開 (danything の既定) なので imagePullSecrets は要らない
apiVersion: v1
kind: Service
metadata:
  name: denpa-hub
  namespace: denpa-hub
spec:
  selector:
    app: denpa-hub
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: denpa-hub-data
  namespace: denpa-hub
spec:
  accessModes:
    - ReadWriteOnce
  # ほかのアプリと同じく、ノードのローカルに置く
  storageClassName: local-path
  resources:
    requests:
      # 見積もりは参加する家が 1 万で、印が 300 MB 前後と、集計の表が 400 日で数百 MB (docs/ranking.md の「データの持ち方」)
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: denpa-hub
  namespace: denpa-hub
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: denpa-hub
  template:
    metadata:
      labels:
        app: denpa-hub
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # distroless の nonroot
        runAsUser: 65532
        runAsGroup: 65532
        # PVC のデータの置き場を nonroot で書けるようにする
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: denpa-hub
          image: ghcr.io/danything/denpa-hub:v0.7.0@sha256:9668acc253ff67f6ebe9ef94aefe72aed05baa060414948ec22910e962692523
          ports:
            - containerPort: 8080
          env:
            - name: PUBLIC_ORIGIN
              value: https://dh.doany.io
            # X-Forwarded-For を信じる範囲 (レート制限を利用者のアドレスごとに数えるため)。
            # 手前は Cloudflare → Gateway (Cilium の Envoy) の 2 段なので、両方を書く。
            # - Pod の網: Gateway は hostNetwork で cilium_host (10.42.x) から繋いでくる。値は denpa の
            #   trustedProxies・oauth2-proxy の --trusted-proxy-ip とそろえてある。網全体を信じるかわりに、
            #   届く相手を network-policy.yaml で Gateway とノードに絞る
            # - Cloudflare の範囲: https://www.cloudflare.com/ips/ (2026-10-30 に確かめた)。
            #   NetBird につないだ端末は Cloudflare を通らずに Gateway へ来るが、そのときは Gateway が書いた接続元がそのまま使われる
            - name: TRUSTED_PROXIES
              value: >-
                10.42.0.0/16,fd42::/64,
                173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,
                108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,
                162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,
                2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,
                2a06:98c0::/29,2c0f:f248::/32
            # 局 (jk の ID) → ニコニコのチャンネル ID。NX-Jikkyo が公開している実況のチャンネルの対応表のうち、公式の実況にチャンネルがある局
            - name: NICONICO_LIVE_CHANNELS
              value: >-
                jk1=ch2646436,jk2=ch2646437,jk4=ch2646438,jk5=ch2646439,jk6=ch2646440,
                jk7=ch2646441,jk8=ch2646442,jk9=ch2646485,jk101=ch2647992,jk211=ch2646846
            # 番組ランキングのデータ。鍵 (RANKING_MARK_KEY) は Secret denpa-hub から読む
            - name: RANKING_DATA
              value: /data/ranking.db
            # 実況のコメントの中継のデータ。ランキングと同じ PVC の別のファイル。鍵 (JIKKYO_KEY) は Secret denpa-hub-jikkyo から読む
            - name: JIKKYO_DATA
              value: /data/jikkyo.db
            # 運営の方針 (jikkyo-policy.yaml の ConfigMap をディレクトリで載せたもの)
            - name: JIKKYO_POLICY
              value: /config/jikkyo-policy.json
            # GC のヒープの上限。メモリの上限 (384Mi) の 8 割 (16 進で書く。0x13333333 = 322122547 バイト)。
            # 過去ログのキャッシュと局ごとの控えのぶん (docs/jikkyo.md の「メモリ」)
            - name: DOTNET_GCHeapHardLimit
              value: "0x13333333"
          envFrom:
            - secretRef:
                name: denpa-hub
            - secretRef:
                name: denpa-hub-live
            - secretRef:
                name: denpa-hub-jikkyo
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # 書けるのはここだけ (ルートは読み取り専用のまま)
            - name: data
              mountPath: /data
            # subPath を使わずにディレクトリで載せる (subPath だと ConfigMap の書き換えが届かない)
            - name: jikkyo-policy
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              # 実況の過去ログのキャッシュと局ごとの控えのぶん (docs/jikkyo.md の「メモリ」)
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: denpa-hub-data
        - name: jikkyo-policy
          configMap:
            name: denpa-hub-jikkyo-policy
