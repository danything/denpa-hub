# deploy/ の秘密 (SopsSecret) を SOPS (age) で暗号化する規則。danything/gitops の .sops.yaml の「アプリの秘密」と同じ 2 つの鍵
# (管理者の鍵とクラスタの鍵。クラスタの中では sops-secrets-operator が復号する)。値 (data・stringData) だけ暗号化する。
# 直すときは danything/gitops の `tools/t sops edit <このリポジトリのファイル>` で開いて push する。
creation_rules:
  - path_regex: ^deploy/.*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    mac_only_encrypted: true
