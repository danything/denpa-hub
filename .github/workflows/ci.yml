name: CI

# build・テスト・イメージの組み立てを PR と main で回す。
# イメージを ghcr.io に push するのは v* のタグを push したときだけ (GITHUB_TOKEN だけで足り、秘密は使わない)。
#
# **amd64 だけを組む。** GitHub の arm64 のランナーを無料で使えるのは public のリポジトリだけなので、
# public にするまでは足さない (足すときは matrix に ubuntu-24.04-arm を加える。AOT はクロスで組まない)。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.403"
      - name: Build
        run: dotnet build denpa-hub.slnx -warnaserror
      - name: Test
        run: dotnet test --project tests/DenpaHub.Tests/DenpaHub.Tests.csproj --output detailed

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build (and push on tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
      # 組んだイメージが設定の誤りで止まること (= 実行ファイルが distroless の上で動くこと) を見る
      - name: Smoke
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -u
          out=$(docker run --rm "ghcr.io/${{ github.repository }}:ci" 2>&1) && status=0 || status=$?
          echo "$out"
          test "$status" = 1
          echo "$out" | grep -q "PUBLIC_ORIGIN"
