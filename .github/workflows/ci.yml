name: CI

# build・テスト・イメージの組み立てを PR と main で回す。
# イメージを ghcr.io に push するのは v* のタグを push したときだけ (GITHUB_TOKEN だけで足り、秘密は使わない)。
#
# **amd64 だけを組む。** arm64 を足すときは matrix に ubuntu-24.04-arm を加える (AOT はクロスで組まない)。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "11.0.100"
      - name: Build
        run: dotnet build denpa-hub.slnx -warnaserror
      - name: Test
        run: dotnet test --project tests/DenpaHub.Tests/DenpaHub.Tests.csproj --output detailed

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build (and push on tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          # User-Agent に載せるバージョン。タグのときだけタグの名前 (v は Dockerfile で除く)
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
      # 組んだイメージが設定の誤りで止まること (= 実行ファイルが distroless の上で動くこと) を見る
      - name: Smoke
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -u
          out=$(docker run --rm "ghcr.io/${{ github.repository }}:ci" 2>&1) && status=0 || status=$?
          echo "$out"
          test "$status" = 1
          echo "$out" | grep -q "PUBLIC_ORIGIN"
      # ランキングを入れて動かし、AOT の実行ファイルが組み込みの SQLite を読めること (= distroless の上でデータを書けること) を見る。
      # 本番と同じく、ルートは読み取り専用で、書けるのはデータの置き場だけ
      - name: Smoke (ranking)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -eu
          key=$(openssl rand -base64 32)
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /data:uid=65532,gid=65532 \
            -e PUBLIC_ORIGIN=https://hub.example.jp \
            -e NICONICO_STATE_KEY="$key" -e NICONICO_CLIENT_ID=smoke -e NICONICO_CLIENT_SECRET=smoke \
            -e NICONICO_AUTHORIZE_URL=https://provider.example/authorize -e NICONICO_TOKEN_URL=https://provider.example/token \
            -e NICONICO_LIVE_CHANNELS=jk1=ch1 \
            -e 'NICONICO_LIVE_PROGRAM_URL=https://provider.example/program?ch={channel}' -e NICONICO_LIVE_PROGRAM_FIELD=/program \
            -e 'NICONICO_LIVE_WATCH_URL=https://provider.example/watch?program={program}&user={user}' \
            -e RANKING_DATA=/data/ranking.db -e RANKING_MARK_KEY="$key" \
            "ghcr.io/${{ github.repository }}:ci"
          for _ in $(seq 30); do curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          token=$(curl -fsS -X POST http://localhost:8080/ranking/tokens | sed -E 's/.*"token":"([^"]+)".*/\1/')
          start=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS -X POST http://localhost:8080/ranking/votes -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"v\":1,\"add\":[{\"network_id\":4,\"service_id\":211,\"event_id\":1,\"start_at\":\"$start\",\"duration\":1800,\"name\":\"smoke\",\"service_name\":\"smoke\",\"genres\":[7],\"kind\":\"manual\"}]}" \
            | grep -q '"accepted":1'
          curl -fsS http://localhost:8080/ranking -H "Authorization: Bearer $token" | grep -q '"entries":\[\]'
          docker logs smoke 2>&1 | grep -q "ranking votes: add=1"
          # 外部に示す集計の読み出し (同じ実行ファイルを引数付きで、動いているコンテナの中で動かす)
          docker exec smoke /app/denpa-hub tallies --from 2026-11-01 | grep -qF '"tallies": []'
          docker rm -f smoke
      # 実況のコメントの中継を入れて動かし、方針のファイルを読み、独自コメントを SQLite に書けることを見る。
      # NX-Jikkyo と過去ログ API には繋がない (購読と過去ログは呼ばず、中継は方針で切る)
      - name: Smoke (jikkyo)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -eu
          key=$(openssl rand -base64 32)
          mkdir -p "$RUNNER_TEMP/jikkyo"
          cat > "$RUNNER_TEMP/jikkyo/policy.json" <<'JSON'
          {"retentionDays":30,"maxLength":60,"postGapSeconds":3,"relayToNx":false,"maxAuthorsPerHome":8,
           "channels":["jk1"],"ngWords":[],"blockedHomes":[],"blockedAuthors":[],"removedComments":[]}
          JSON
          docker run -d --name smoke-jikkyo -p 8080:8080 --read-only --tmpfs /data:uid=65532,gid=65532 \
            -v "$RUNNER_TEMP/jikkyo:/config:ro" \
            -e PUBLIC_ORIGIN=https://hub.example.jp \
            -e NICONICO_STATE_KEY="$key" -e NICONICO_CLIENT_ID=smoke -e NICONICO_CLIENT_SECRET=smoke \
            -e NICONICO_AUTHORIZE_URL=https://provider.example/authorize -e NICONICO_TOKEN_URL=https://provider.example/token \
            -e NICONICO_LIVE_CHANNELS=jk1=ch1 \
            -e 'NICONICO_LIVE_PROGRAM_URL=https://provider.example/program?ch={channel}' -e NICONICO_LIVE_PROGRAM_FIELD=/program \
            -e 'NICONICO_LIVE_WATCH_URL=https://provider.example/watch?program={program}&user={user}' \
            -e JIKKYO_DATA=/data/jikkyo.db -e JIKKYO_KEY="$key" -e JIKKYO_POLICY=/config/policy.json \
            "ghcr.io/${{ github.repository }}:ci"
          for _ in $(seq 30); do curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          docker logs smoke-jikkyo 2>&1 | grep -q "jikkyo: on"
          token=$(curl -fsS -X POST http://localhost:8080/jikkyo/tokens | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -fsS -X POST http://localhost:8080/jikkyo/channels/jk1/comments -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"author":"AAAAAAAAAAAAAAAAAAAAAA","text":"スモーク","color":"red"}' | grep -q '"id":'
          # 削除依頼を調べるときの読み出し (同じ実行ファイルを引数付きで、動いているコンテナの中で動かす)
          docker exec smoke-jikkyo /app/denpa-hub comments jk1 "$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)" "$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" \
            | grep -qF 'スモーク'
          docker rm -f smoke-jikkyo
